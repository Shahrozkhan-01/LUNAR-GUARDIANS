services:
  - type: web
    name: lunar-guardians-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NASA_API_KEY
        sync: false
      - key: NASA_CACHE_SECONDS
        value: "900"
      - key: FRONTEND_URL
        value: https://shahrozkhan-01.github.io
